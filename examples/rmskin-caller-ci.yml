name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: Hung1510/ci/.github/workflows/rmskin-release.yml@v1
    permissions:
      contents: write
    with:
      package-script: package.sh
      artifact: '*.rmskin'
      # shellcheck-glob: '*.sh'   # set to '' to skip linting if it's too noisy at first
