name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: Hung1510/ci/.github/workflows/go-release.yml@v1
    permissions:
      contents: write
    with:
      binary: weatherfetch
